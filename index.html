<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Interactice Blog</title>
</head>

<body>
    <div class="container">

        <form class="form">
            <div id="headings">
                <h1>Pages Without Borders</h1>
                <small>Share your thoughts!</small>
            </div>

            <div class="form-group">
                <label for="post">Post Title: </label>
                <input type="text" id="post-title" name="post" required />
            </div>

            <div class="form-group">
                <label for="post">What's on your mind? </label>
                <textarea name="post" id="post" rows="15" required></textarea>
            </div>
            
        </form>

        <aside class="aside">
            <img src="" alt="">
        </aside>


    </div>

</body>

</html>
