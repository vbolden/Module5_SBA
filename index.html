<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Interactice Blog</title>
</head>

<body>
    <div class="image-header">
        <img src="images/journaling.jpg" alt="a journal, pen, lit candle, and mug ">
    </div>
    <div class="container">

        <form class="form" id="form">
            <div id="headings">
                <h1>Pages Without Borders</h1>
                <small>Share your thoughts!</small>
            </div>

            <div class="form-group">
                <label for="title">Post Title: </label>
                <input type="text" id="post-title" name="title" minlength="3" required />
                <span id="title-error"></span>
            </div>

            <div class="form-group">
                <label for="post">What's on your mind? </label>
                <textarea name="post" id="textbox" rows="15" required></textarea>
                <span id="text-error"></span>
            </div>

            <button type="submit" id="addButton">Add Post</button>

        </form>

        <aside class="aside">
            <h3>Blog Posts</h3>
            <div id="cards-container"></div>

            <div id="delete-modal" class="display-none">
                <h3 id="delete-heading">Are you sure you want to delete this post?</h3>
                <button id="confirm-delete">Yes</button>
                <button id="cancel-delete">Cancel</button>
            </div>

            <div id="edit-modal" class="display-none">
                <h3 id="save-heading">Do you want to save the changes?</h3>
                <input type="text" name="edit-title" id="titleEdit">
                <textarea name="edit-text" id="textEdit"></textarea>
                <button id="confirm-edit" class="confirm">Yes</button>
                <button id="cancel-edit">Cancel</button>
            </div>
        </aside>




    </div>

</body>

</html>
